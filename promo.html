<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo & Voucher | Bakoel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --bg-color: #e0e5ec; --text-main: #2d3436; --text-muted: #636e72; --accent-color: #0984e3;
            --shadow-light: #ffffff; --shadow-dark: #a3b1c6;
            --neu-flat: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
            --neu-pressed: inset 6px 6px 10px var(--shadow-dark), inset -6px -6px 10px var(--shadow-light);
            --neu-flat-sm: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            --neu-pressed-sm: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        [data-theme="dark"] {
            --bg-color: #1a1b1e; --text-main: #f5f6fa; --text-muted: #a4b0be; --accent-color: #00e5ff;
            --shadow-light: rgba(255, 255, 255, 0.05); --shadow-dark: rgba(0, 0, 0, 0.6);
            --neu-flat: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
            --neu-pressed: inset 6px 6px 10px var(--shadow-dark), inset -6px -6px 10px var(--shadow-light);
            --neu-flat-sm: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            --neu-pressed-sm: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: background-color 0.4s ease, color 0.4s ease; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .top-nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; background-color: var(--bg-color); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .logo { font-size: 20px; font-weight: 700; color: var(--accent-color); letter-spacing: 2px; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        
        .controls { display: flex; align-items: center; gap: 20px; flex: 1; justify-content: flex-end; }
        .theme-switch { width: 60px; height: 30px; border-radius: 50px; background: var(--bg-color); box-shadow: var(--neu-pressed); position: relative; cursor: pointer; display: flex; align-items: center; padding: 4px; }
        .switch-handle { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-color); box-shadow: var(--neu-flat); position: absolute; left: 4px; transition: transform 0.4s ease; display: flex; justify-content: center; align-items: center; color: var(--accent-color); font-size: 10px; }
        [data-theme="dark"] .switch-handle { transform: translateX(30px); }

        .nav-link { color: var(--text-muted); text-decoration: none; position: relative; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: color 0.3s ease;}
        .nav-link:hover { color: var(--accent-color); }
        
        .neu-btn-icon { background: var(--bg-color); color: var(--text-main); border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 18px; display: flex; justify-content: center; align-items: center; box-shadow: var(--neu-flat-sm); cursor: pointer; text-decoration: none; position: relative; }
        .neu-btn-icon:active { box-shadow: var(--neu-pressed-sm); color: var(--accent-color); }
        
        .nav-profile-badge { display: flex; flex-direction: row; align-items: center; justify-content: center; text-decoration: none; gap: 10px; transition: transform 0.2s ease; cursor: pointer; background: var(--bg-color); padding: 5px 15px 5px 5px; border-radius: 50px; box-shadow: var(--neu-flat-sm); }
        .nav-profile-badge img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; box-shadow: var(--neu-pressed-sm); border: 2px solid transparent; }
        .nav-profile-badge span { font-size: 13px; font-weight: 700; color: var(--text-main); max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-btn-cap { background: var(--bg-color); color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 50px; box-shadow: var(--neu-flat-sm); transition: all 0.2s; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; }
        .page-header { margin-bottom: 30px; text-align: center; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--accent-color); margin-bottom: 10px; }
        .page-desc { font-size: 14px; color: var(--text-muted); }

        .promo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-bottom: 50px; }
        
        .promo-card { background: var(--bg-color); border-radius: 20px; padding: 25px; box-shadow: var(--neu-flat); display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden; }
        .promo-card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--accent-color); border-radius: 20px 0 0 20px; }
        
        .promo-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .promo-title { font-size: 18px; font-weight: 700; color: var(--text-main); line-height: 1.3; }
        .promo-badge { background: var(--bg-color); color: var(--accent-color); font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 50px; box-shadow: var(--neu-pressed-sm); white-space: nowrap; }
        
        .promo-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; flex: 1; }
        
        .promo-code-box { background: var(--bg-color); padding: 12px 15px; border-radius: 12px; box-shadow: var(--neu-pressed-sm); display: flex; justify-content: space-between; align-items: center; border: 1px dashed var(--text-muted); }
        .promo-code-text { font-size: 16px; font-weight: 800; letter-spacing: 2px; color: var(--accent-color); }
        .btn-copy { background: var(--bg-color); border: none; color: var(--text-main); font-size: 12px; font-weight: 700; padding: 8px 15px; border-radius: 50px; box-shadow: var(--neu-flat-sm); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-copy:active { box-shadow: var(--neu-pressed-sm); color: var(--accent-color); }
        .btn-copy.copied { color: #27ae60; box-shadow: var(--neu-pressed-sm); }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 50px; margin-bottom: 15px; opacity: 0.5; }

        .bottom-nav { display: none; }

        @media (max-width: 768px) {
            .top-nav { padding: 12px 20px; }
            .hide-on-mobile { display: none !important; }
            .container { padding-bottom: 100px; margin-top: 10px; }
            .promo-grid { grid-template-columns: 1fr; gap: 20px; }

            .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--bg-color); border-radius: 25px 25px 0 0; box-shadow: 0 -8px 20px rgba(0,0,0,0.05); z-index: 999; padding: 10px 15px; justify-content: space-between; padding-bottom: max(15px, env(safe-area-inset-bottom)); gap: 8px; }
            [data-theme="dark"] .bottom-nav { box-shadow: 0 -8px 20px rgba(0,0,0,0.4); }
            
            .bottom-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--text-muted); font-size: 10px; font-weight: 600; padding: 10px 0; border-radius: 18px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .bottom-nav-item i { font-size: 20px; margin-bottom: 4px; transition: transform 0.2s ease; }
            .bottom-nav-item.active { color: var(--accent-color); background: var(--bg-color); box-shadow: var(--neu-pressed-sm); }
            .bottom-nav-item.active i { transform: scale(1.15); }
        }
    </style>
    <script src="analytics.js"></script>
</head>
<body>

    <div class="top-nav">
        <a href="index.html" class="logo"><i class="fas fa-box-open"></i> BAKOEL</a>
        <div class="controls">
            <div class="theme-switch" id="themeToggle"><div class="switch-handle"><i class="fas fa-sun" id="switchIcon"></i></div></div>
            <a href="promo.html" class="nav-link hide-on-mobile" style="color: var(--accent-color);"><i class="fas fa-tags"></i> <span>Promo</span></a>
            <a href="pesanan.html" class="nav-link hide-on-mobile"><i class="fas fa-box"></i> <span>Pesanan</span></a>
            <a href="keranjang.html" class="neu-btn-icon hide-on-mobile"><i class="fas fa-shopping-cart"></i></a>
            <a href="login.html" class="nav-btn-cap hide-on-mobile" id="navLoginBtn"><i class="fas fa-sign-in-alt"></i> <span>Login</span></a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title"><i class="fas fa-ticket-alt"></i> Promo & Voucher</h1>
            <p class="page-desc">Klaim kode promo di bawah ini dan nikmati potongan harga spesial untuk pesanan grosir Anda.</p>
        </div>

        <div class="promo-grid" id="promoContainer">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Memuat promo terbaru...</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item"><i class="fas fa-home"></i><span>Beranda</span></a>
        <a href="promo.html" class="bottom-nav-item active"><i class="fas fa-tags"></i><span>Promo</span></a>
        <a href="keranjang.html" class="bottom-nav-item"><i class="fas fa-shopping-cart"></i><span>Keranjang</span></a>
        <a href="pesanan.html" class="bottom-nav-item"><i class="fas fa-box"></i><span>Pesanan</span></a>
        <a href="akun.html" class="bottom-nav-item" id="mobileAccountBtn"><i class="fas fa-user"></i><span>Akun</span></a>
    </nav>

    <script>
        "use strict";

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        const sessionData = localStorage.getItem('user_session');
        const session = sessionData ? JSON.parse(sessionData) : null;

        async function updateNavUI() {
            const loginBtn = document.getElementById('navLoginBtn');
            const mobileAccountBtn = document.getElementById('mobileAccountBtn');

            if (session && session.access_token) {
                try {
                    const userRes = await fetch('/api/user', { headers: { 'Authorization': `Bearer ${session.access_token}` } });
                    if (userRes.ok) {
                        const userData = await userRes.json();
                        const displayName = escapeHTML(userData.nama_panggilan || (userData.nama_lengkap ? userData.nama_lengkap.split(' ')[0] : "User"));
                        const avatarUrl = `https://api.dicebear.com/7.x/micah/svg?seed=${encodeURIComponent(displayName)}&backgroundColor=e0e5ec&baseColor=f9c9b6`;

                        loginBtn.className = 'nav-profile-badge hide-on-mobile';
                        loginBtn.href = 'akun.html';
                        loginBtn.innerHTML = `<img src="${avatarUrl}" alt="Avatar"><span>${displayName}</span>`;

                        if (mobileAccountBtn) {
                            mobileAccountBtn.href = 'akun.html';
                            mobileAccountBtn.innerHTML = `<img src="${avatarUrl}" alt="Avatar" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; margin-bottom: 2px;"><span>${displayName}</span>`;
                        }
                        return;
                    }
                } catch (e) { }
            }
            
            loginBtn.className = 'nav-btn-cap hide-on-mobile';
            loginBtn.href = 'login.html';
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Login</span>';

            if (mobileAccountBtn) {
                mobileAccountBtn.href = 'login.html';
                mobileAccountBtn.innerHTML = '<i class="fas fa-user"></i><span>Akun</span>';
            }
        }

        async function loadVouchers() {
            const container = document.getElementById('promoContainer');
            if (!session) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-lock"></i><br>Silakan <a href="login.html" style="color:var(--accent-color);">Login</a> terlebih dahulu untuk melihat promo eksklusif Anda.</div>`;
                return;
            }

            try {
                const res = await fetch('/api/vouchers', { headers: { 'Authorization': `Bearer ${session.access_token}` } });
                if (!res.ok) throw new Error();
                
                const vouchers = await res.json();
                container.innerHTML = '';

                if (vouchers.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><br>Belum ada promo yang tersedia untuk Anda saat ini.</div>`;
                    return;
                }

                vouchers.forEach(v => {
                    const safeColor = escapeHTML(v.color);
                    const safeTitle = escapeHTML(v.title);
                    const safeDesc = escapeHTML(v.desc);
                    const safeCode = escapeHTML(v.code);
                    
                    const card = document.createElement('div');
                    card.className = 'promo-card';
                    card.innerHTML = `
                        <style>.promo-card:nth-child(${v.id})::before { background: ${safeColor}; }</style>
                        <div class="promo-header">
                            <div class="promo-title">${safeTitle}</div>
                            <div class="promo-badge" style="color: ${safeColor};"><i class="fas fa-star"></i> Promo</div>
                        </div>
                        <div class="promo-desc">${safeDesc}</div>
                        <div class="promo-code-box">
                            <div class="promo-code-text" style="color: ${safeColor};">${safeCode}</div>
                            <button class="btn-copy" onclick="copyToClipboard('${safeCode}', this)"><i class="fas fa-copy"></i> Salin</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Gagal memuat daftar promo.</div>`;
            }
        }

        window.copyToClipboard = function(code, btnElement) {
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                btnElement.classList.add('copied');
                
                if (window.BakoelAnalytics && typeof window.BakoelAnalytics.trackFunnel === 'function') {
                    window.BakoelAnalytics.trackFunnel('Menyalin Kode Promo: ' + escapeHTML(code));
                }

                setTimeout(() => { btnElement.innerHTML = originalText; btnElement.classList.remove('copied'); }, 2000);
            });
        }

        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') { html.setAttribute('data-theme', 'dark'); document.getElementById('switchIcon').classList.replace('fa-sun', 'fa-moon'); }
        themeToggle.addEventListener('click', () => {
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            document.getElementById('switchIcon').classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateNavUI();
            loadVouchers();
        });
    </script>
</body>
</html>
