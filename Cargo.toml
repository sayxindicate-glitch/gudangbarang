[package]
name = "api-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Menambahkan rt-multi-thread agar reqwest berjalan optimal
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vercel_runtime = "1.1.1"
# MEMATIKAN OpenSSL (default) DAN MENGHIDUPKAN Rustls-TLS
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"

# ... (Biarkan daftar [[bin]] di bawahnya tetap sama persis seperti sebelumnya) ...

[[bin]]
name = "products"
path = "api/products.rs"

[[bin]]
name = "apply-voucher"
path = "api/apply-voucher.rs"

[[bin]]
name = "auth"
path = "api/auth.rs"

[[bin]]
name = "cart"
path = "api/cart.rs"

[[bin]]
name = "checkout"
path = "api/checkout.rs"

[[bin]]
name = "logos"
path = "api/logos.rs"

[[bin]]
name = "orders"
path = "api/orders.rs"

[[bin]]
name = "user"
path = "api/user.rs"

# Tambahan final untuk Marketing & Promo
[[bin]]
name = "vouchers"
path = "api/vouchers.rs"
